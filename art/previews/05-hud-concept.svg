<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Hide iT mission HUD concept</title>
  <desc id="desc">Original hotel corridor scene and proposed HUD, showing suspicion, contextual head grip, and a separate chase and arrest rescue state reference. All AI states are proposed.</desc>
  <defs>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#eee9de}.muted{fill:#bac1bb}.body{font-size:34px}.small{font-size:28px}.label{font-size:30px}.eyebrow{font-size:26px;letter-spacing:1.6px;font-weight:700}.stroke{fill:none;stroke:#eee9de;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.rule{stroke:#53615d;stroke-width:2}.teal{fill:#8bd0c5}.amber{fill:#e5bf76}</style>
    <symbol id="eye" viewBox="0 0 60 40"><path d="M3 20 Q30 -7 57 20 Q30 47 3 20Z" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="30" cy="20" r="8" fill="currentColor"/></symbol>
    <symbol id="alert" viewBox="0 0 52 48"><path d="M26 4 L49 43 H3Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M26 17 V29" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="26" cy="36" r="2.5" fill="currentColor"/></symbol>
